[package]
name = "simple-firewall"
version = "0.1.2"
edition = "2021"
publish = false

[dependencies]
simple-firewall-common = { path = "../simple-firewall-common", features = ["user"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
aya-log = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time"
] }

clap = { workspace = true, features = ["derive", "help", "usage"] }
figment = { version = "0.10.19", features = ["toml"] }
network-types = "0.0.7"
bytes = "1.6.0"
serde = { version = "1.0.204", features = ["derive"] }
log4rs = { version = "1.3.0", features = ["gzip"] }
nohash-hasher = "0.2.0"

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
simple-firewall-ebpf = { path = "../simple-firewall-ebpf" }

[[bin]]
name = "sfw"
path = "src/main.rs"
